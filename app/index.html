<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LexClock</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        /* Brand — LexClock design system (ocean blue + approval orange).
           Variable names preserved; values are the new brand tokens. */
        --ink: #15232e;          /* ocean ink — primary text */
        --ink-2: #34454f;        /* secondary text */
        --navy: #08384c;         /* ocean-900 — dark surfaces */
        --navy-dark: #062a3a;    /* deepest ocean */
        --brand: #1b6fa8;        /* ocean-600 — brand blue, links */
        --brand-strong: #0b4f6c; /* ocean-800 — primary anchor */
        --brand-soft: #eff5f9;   /* ocean-050 — faint tint */
        --brand-ring: rgba(27, 111, 168, 0.34);
        --accent: #e8842b;       /* orange-500 — CTA / approve */
        --accent-strong: #ce6e18;/* orange-600 — hover / pressed */
        --accent-soft: #fdf1e2;  /* orange-050 — approve-zone tint */
        --gold: #e8842b;
        /* Neutrals */
        --white: #ffffff;
        --surface: #ffffff;
        --surface-2: #eef2f6;
        --bg: #f7f9fb;           /* surface */
        --grey-light: #eef2f6;
        --grey-text: #5b6b76;
        --grey-mid: #c2ccd6;
        --muted: #5b6b76;
        --border: #dce3ea;       /* line */
        --border-strong: #c2ccd6;
        /* Status */
        --green: #2e9e6b;        /* green-600 — approved */
        --green-soft: rgba(46, 158, 107, 0.14);
        --red: #c0392b;          /* cool red — errors ONLY, never approve */
        --red-soft: rgba(192, 57, 43, 0.1);
        /* Effects — soft, ocean-tinted */
        --shadow-sm: 0 1px 2px rgba(11, 79, 108, 0.06), 0 1px 3px rgba(11, 79, 108, 0.08);
        --shadow: 0 1px 3px rgba(11, 79, 108, 0.08);
        --shadow-md: 0 6px 18px rgba(11, 79, 108, 0.09), 0 2px 5px rgba(11, 79, 108, 0.06);
        --shadow-lg: 0 24px 60px rgba(8, 56, 76, 0.18), 0 6px 16px rgba(8, 56, 76, 0.08);
        --radius: 10px;
        --radius-sm: 8px;
        --radius-lg: 14px;
        /* Type system */
        --font-head: "Libre Franklin", "Helvetica Neue", Helvetica, Arial, sans-serif;
        --font-ui: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        --font-serif: "Source Serif 4", "Iowan Old Style", Georgia, "Times New Roman", serif;
        --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
      }

      body {
        font-family: var(--font-ui);
        background: var(--bg);
        color: var(--ink);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      h1,
      h2,
      h3,
      h4 {
        font-family: var(--font-head);
        letter-spacing: -0.02em;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      a {
        color: inherit;
      }

      button,
      .nav-item,
      .btn-connect,
      .help-btn,
      .field-row input,
      .field-row select,
      .field-row textarea {
        transition: background-color 0.16s ease, border-color 0.16s ease,
          color 0.16s ease, box-shadow 0.16s ease, transform 0.06s ease;
      }

      :focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }

      h1,
      h2,
      h3 {
        letter-spacing: -0.01em;
      }

      .app-shell {
        min-height: 100vh;
        display: flex;
      }

      .sidebar {
        width: 248px;
        background: linear-gradient(185deg, var(--brand-strong) 0%, var(--navy) 55%, var(--navy-dark) 100%);
        color: var(--white);
        padding: 26px 16px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        position: sticky;
        top: 0;
        height: 100vh;
        border-right: 1px solid rgba(255, 255, 255, 0.06);
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .brand-mark {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: linear-gradient(150deg, var(--brand-strong), var(--navy));
        color: var(--white);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        box-shadow: 0 6px 16px rgba(11, 79, 108, 0.34);
      }

      .brand-mark svg {
        width: 28px;
        height: 28px;
        display: block;
      }

      .brand h1 {
        font-size: 1.4rem;
      }

      .brand p,
      .nav-footer p,
      .meta-text,
      .helper-text {
        color: rgba(255, 255, 255, 0.72);
      }

      .sidebar-nav,
      .mobile-nav {
        display: flex;
        gap: 8px;
      }

      .sidebar-nav {
        flex-direction: column;
      }

      .nav-item {
        min-height: 44px;
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 12px 14px;
        background: transparent;
        color: rgba(255, 255, 255, 0.78);
        display: flex;
        align-items: center;
        gap: 12px;
        text-align: left;
        position: relative;
        font-weight: 500;
      }

      .sidebar-nav .nav-item:hover {
        background: rgba(255, 255, 255, 0.06);
        color: var(--white);
      }

      .nav-item.active {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.14);
        color: var(--white);
        font-weight: 600;
      }

      .sidebar-nav .nav-item.active::before {
        content: '';
        position: absolute;
        left: -16px;
        top: 50%;
        transform: translateY(-50%);
        width: 3px;
        height: 22px;
        border-radius: 0 3px 3px 0;
        background: var(--accent);
      }

      .nav-badge {
        margin-left: auto;
        min-width: 20px;
        height: 20px;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-size: 0.72rem;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }

      .nav-icon {
        width: 20px;
        height: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .nav-icon svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .nav-footer {
        margin-top: auto;
        padding: 16px;
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .nav-footer strong {
        display: block;
        margin-top: 6px;
        font-size: 1.05rem;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }

      .main-content {
        flex: 1;
        padding: 32px 24px 96px;
      }

      .content-wrap {
        max-width: 960px;
        margin: 0 auto;
      }

      .view {
        display: none;
      }

      .view.active {
        display: block;
      }

      .view-header {
        margin-bottom: 22px;
      }

      .view-header h2 {
        font-size: 2.15rem;
        font-weight: 800;
        letter-spacing: -0.025em;
        margin-bottom: 8px;
      }

      .view-grid,
      .card-grid,
      .form-grid,
      .stats-grid,
      .settings-grid {
        display: grid;
        gap: 16px;
      }

      .stats-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .settings-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .card {
        background: var(--surface);
        border-radius: var(--radius-lg);
        padding: 24px 26px;
        box-shadow: var(--shadow-md);
        border: 1px solid var(--border);
      }

      .card + .card {
        margin-top: 16px;
      }

      .card-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      .card-title h3 {
        font-size: 1.05rem;
        font-weight: 600;
      }

      .stat-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .stat-value {
        font-size: 1.9rem;
        font-weight: 700;
      }

      .money {
        color: var(--green);
      }

      .meta-text,
      .helper-text,
      .empty-state p,
      .field-row small,
      .table-subtext,
      .row-stack small {
        color: var(--grey-text);
      }

      .hero-banner {
        background: linear-gradient(135deg, var(--brand-strong), var(--navy) 60%, var(--navy-dark));
        color: var(--white);
        overflow: hidden;
        position: relative;
        border: none;
      }

      .hero-banner::after {
        content: '';
        position: absolute;
        inset: auto -60px -70px auto;
        width: 240px;
        height: 240px;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(255, 148, 16, 0.45), rgba(255, 148, 16, 0));
      }

      .hero-banner > * {
        position: relative;
        z-index: 1;
      }

      .hero-banner h3 {
        font-size: 1.45rem;
        margin-bottom: 10px;
      }

      .hero-banner p {
        color: rgba(255, 255, 255, 0.82);
        max-width: 60ch;
      }

      .button-row,
      .inline-actions,
      .filter-row,
      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .button-row {
        margin-top: 18px;
      }

      .btn-primary,
      .btn-secondary,
      .btn-gold,
      .btn-danger {
        min-height: 44px;
        border-radius: 999px;
        padding: 10px 22px;
        border: 1px solid transparent;
        font-weight: 600;
      }

      .btn-primary:active,
      .btn-secondary:active,
      .btn-gold:active,
      .btn-danger:active {
        transform: translateY(1px);
      }

      .btn-primary {
        background: var(--accent);
        color: var(--white);
        box-shadow: 0 1px 2px rgba(246, 130, 31, 0.26);
      }

      .btn-primary:hover {
        background: var(--accent-strong);
        box-shadow: 0 3px 10px rgba(246, 130, 31, 0.3);
      }

      .btn-secondary {
        background: var(--white);
        color: var(--ink);
        border-color: var(--border-strong);
      }

      .btn-secondary:hover {
        background: var(--surface-2);
        border-color: var(--brand);
        color: var(--brand-strong);
      }

      .btn-gold {
        background: var(--accent);
        color: var(--white);
        box-shadow: 0 1px 2px rgba(232, 132, 43, 0.26);
      }

      .btn-gold:hover {
        background: var(--accent-strong);
        box-shadow: 0 3px 10px rgba(232, 132, 43, 0.3);
      }

      .btn-danger {
        background: transparent;
        color: var(--red);
        border-color: var(--red);
      }

      .btn-danger:hover {
        background: var(--red-soft);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 0.9rem;
        background: var(--grey-light);
      }

      .pill.billable {
        color: var(--green);
        background: rgba(45, 125, 70, 0.1);
      }

      .pill.non-billable {
        color: var(--grey-text);
        background: #ebeef3;
      }

      .pill-warn {
        color: var(--accent-strong);
        background: var(--accent-soft);
        font-weight: 600;
      }

      .pill-soft {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 3px 9px;
        color: var(--brand-strong);
        background: var(--brand-soft);
      }

      /* Phase 4 — Notion source card */
      .source-card {
        border-left: 4px solid var(--brand);
      }

      .source-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
        padding: 12px 0 4px;
      }

      .source-name {
        display: block;
        font-weight: 700;
        color: var(--ink);
      }

      .source-sub {
        display: block;
        font-size: 0.84rem;
        color: var(--muted);
      }

      .source-foot {
        margin-top: 12px;
        font-size: 0.82rem;
        color: var(--muted);
      }

      .notion-status {
        margin-top: 12px;
        border-radius: var(--radius-sm);
        padding: 10px 14px;
        font-size: 0.88rem;
      }

      .notion-status-loading {
        background: var(--brand-soft);
        color: var(--brand-strong);
      }

      .notion-status-ok {
        background: var(--green-soft);
        color: var(--green);
      }

      .notion-status-error {
        background: var(--accent-soft);
        color: var(--accent-strong);
      }

      .reconcile-card {
        border-left: 4px solid var(--accent);
      }

      .reconcile-bar {
        position: relative;
        height: 8px;
        border-radius: 999px;
        background: var(--surface-2);
        overflow: hidden;
        margin-top: 12px;
      }

      .reconcile-bar > span {
        display: block;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #ffa451, var(--accent));
      }

      .capture-row {
        display: flex;
        gap: 10px;
        margin-top: 12px;
      }

      .capture-row input {
        flex: 1;
        min-width: 0;
      }

      .capture-row .btn-primary {
        flex-shrink: 0;
      }

      @media (max-width: 560px) {
        .capture-row {
          flex-direction: column;
        }
      }

      .bill-nudge {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 12px;
        margin-top: 10px;
        padding: 9px 12px;
        border-radius: var(--radius-sm);
        background: var(--surface-2);
        border: 1px solid var(--border);
        font-size: 0.85rem;
        color: var(--grey-text);
      }

      .bill-nudge strong {
        color: var(--ink);
      }

      .bill-nudge-warn {
        background: var(--accent-soft);
        border-color: var(--accent-soft);
        color: var(--accent-strong);
      }

      .bill-nudge-msg {
        flex-basis: 100%;
      }

      .link-btn {
        background: none;
        border: none;
        padding: 0;
        font: inherit;
        font-weight: 600;
        color: var(--accent-strong);
        text-decoration: underline;
        cursor: pointer;
      }

      .wip-aging {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }

      .wip-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 14px;
        border-radius: 999px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        font-size: 0.86rem;
        color: var(--grey-text);
      }

      .wip-chip strong {
        color: var(--ink);
      }

      .wip-chip-old {
        background: var(--accent-soft);
        border-color: var(--accent-soft);
        color: var(--accent-strong);
      }

      .wip-chip-old strong {
        color: var(--accent-strong);
      }

      .wip-stale td {
        background: var(--accent-soft);
      }

      .wip-flag {
        display: inline-block;
        margin-left: 6px;
        padding: 1px 8px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: #fff;
        background: var(--accent);
      }

      .timer-total {
        font-size: 2rem;
        font-weight: 700;
      }

      .timer-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      .list-table {
        width: 100%;
        border-collapse: collapse;
      }

      .list-table th,
      .list-table td {
        text-align: left;
        padding: 14px 12px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }

      .list-table th {
        font-size: 0.88rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--grey-text);
      }

      .list-table tr.non-billable {
        color: var(--grey-text);
        background: #fafbfd;
      }

      .row-stack {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .empty-state {
        border: 1px dashed var(--grey-mid);
        background: linear-gradient(180deg, #fbfcfe, #f4f6f9);
        text-align: center;
        padding: 28px 20px;
        border-radius: var(--radius);
      }

      .empty-state h3 {
        margin-bottom: 8px;
      }

      .field-row {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field-row label {
        font-weight: 600;
      }

      .field-row input,
      .field-row select,
      .field-row textarea {
        min-height: 44px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-strong);
        background: var(--white);
        padding: 10px 12px;
        color: var(--ink);
      }

      .field-row input::placeholder,
      .field-row textarea::placeholder {
        color: #9aa6b8;
      }

      .field-row input:focus,
      .field-row select:focus,
      .field-row textarea:focus {
        outline: none;
        border-color: var(--brand);
        box-shadow: 0 0 0 3px var(--brand-ring);
      }

      .field-row textarea {
        min-height: 110px;
        resize: vertical;
      }

      .form-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .form-grid .full-span {
        grid-column: 1 / -1;
      }

      .split-card {
        display: grid;
        gap: 16px;
        grid-template-columns: 1.2fr 0.8fr;
      }

      .tier-grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .tier-card {
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 16px;
        background: var(--surface-2);
      }

      .tier-card h4 {
        margin-bottom: 6px;
      }

      .draft-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .draft-card {
        border-left: 3px solid var(--accent);
        transition: box-shadow 0.18s ease, transform 0.34s cubic-bezier(0.2, 0.7, 0.2, 1),
          opacity 0.34s cubic-bezier(0.2, 0.7, 0.2, 1), background 0.28s ease;
      }

      .draft-card.approving {
        background: var(--green-soft);
        border-left-color: var(--green);
        box-shadow: 0 0 0 3px var(--green-soft);
      }

      .draft-card.leaving {
        transform: translateX(40px);
        opacity: 0;
      }

      /* ---- Review summary stat row ---- */
      .review-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin-bottom: 18px;
      }

      .rv-stat {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 16px 18px;
        box-shadow: var(--shadow-sm);
      }

      .rv-stat .rv-stat-label {
        font-family: var(--font-mono);
        font-size: 0.66rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .rv-stat .rv-stat-value {
        font-family: var(--font-head);
        font-weight: 800;
        font-size: 1.62rem;
        letter-spacing: -0.02em;
        margin-top: 6px;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }

      .rv-stat .rv-stat-sub {
        font-size: 0.78rem;
        color: var(--muted);
        margin-top: 2px;
      }

      .rv-stat.rv-stat-await {
        border-color: rgba(232, 132, 43, 0.34);
        background: var(--accent-soft);
      }
      .rv-stat.rv-stat-await .rv-stat-value {
        color: var(--accent-strong);
      }
      .rv-stat.rv-stat-billed {
        border-color: rgba(46, 158, 107, 0.34);
        background: var(--green-soft);
      }
      .rv-stat.rv-stat-billed .rv-stat-value {
        color: var(--green);
      }

      /* ---- Entry card (prototype display) ---- */
      .draft-display {
        display: block;
      }
      .draft-card.editing .draft-display {
        display: none;
      }
      .draft-edit {
        display: none;
      }
      .draft-card.editing .draft-edit {
        display: block;
      }

      .draft-row1 {
        display: flex;
        align-items: flex-start;
        gap: 18px;
      }

      .draft-time-col {
        flex: 0 0 auto;
        min-width: 92px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .draft-hrs {
        font-family: var(--font-head);
        font-weight: 800;
        font-size: 1.9rem;
        line-height: 1;
        letter-spacing: -0.02em;
        color: var(--brand-strong);
        font-variant-numeric: tabular-nums;
      }
      .draft-hrs-unit {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--muted);
        margin-left: 3px;
      }
      .draft-time-meta {
        font-size: 0.78rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;

      /* ---- Evidence drawer (slide-over) ---- */
      .ev-scrim {
        position: fixed;
        inset: 0;
        background: rgba(8, 56, 76, 0.34);
        backdrop-filter: blur(2px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.24s ease;
        z-index: 80;

      .ev-scrim.open {
        opacity: 1;
        pointer-events: auto;
      }
      .ev-drawer {
        position: fixed;
        top: 0;
        right: 0;
        height: 100%;
        width: 480px;
        max-width: 92vw;
        background: var(--white);
        box-shadow: var(--shadow-lg);
        transform: translateX(100%);
        transition: transform 0.32s cubic-bezier(0.2, 0.7, 0.2, 1);
        z-index: 81;
        display: flex;
        flex-direction: column;

        border-bottom: 1px solid var(--border);

        height: 30px;

        cursor: pointer;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1;

        flex: 1 1 auto;

      .ev-meta-row {

        gap: 26px;
        align-items: baseline;

      .ev-meta-row .ev-hrs {

        font-weight: 800;
        font-size: 1.9rem;

        font-size: 1.1rem;
        color: var(--ink);

      .ev-matter {

      .ev-meter-label {

        justify-content: space-between;

        color: var(--ink-2);

        margin-bottom: 6px;

      .ev-meter {

        border-radius: 999px;
        background: var(--surface-2);

      }
      .ev-meter > span {

      .ev-why {

        line-height: 1.5;

      .ev-source-card {

        border-radius: var(--radius-sm);
        padding: 14px 16px;

        if (!raw) return fallback;
        try {
          return JSON.parse(raw);
        } catch (error) {
          return fallback;
        }
      }

      function setJson(key, value) {

      function cloneDefault(value) {
        return JSON.parse(JSON.stringify(value));

      function createDraft({ source, matterId, date, estimatedSeconds, description, billable = true, confidence = null, evidence = '', externalId = null, backendId = null }) {
        const matters = getMatters();
        const safeMatter = matters.some((matter) => matter.id === matterId) ? matterId : (matters[0] && matters[0].id) || DEFAULT_MATTER.id;
        return {
          id: generateId('draft'),
          source: source in DRAFT_SOURCE_LABELS ? source : 'manual',
          matterId: safeMatter,
          date: date || todayKey(),
          estimatedSeconds: Math.max(0, Math.round(Number(estimatedSeconds) || 0)),
          description: String(description || '').trim(),
          billable: Boolean(billable),
          confidence: confidence == null ? null : Number(confidence),
          evidence: String(evidence || '').trim(),
          externalId: externalId ? String(externalId) : null,
          backendId: backendId ? String(backendId) : null,
          status: 'pending',
          createdAt: Date.now(),
        };
      }

      function addDraft(draftInput) {
        const draft = createDraft(draftInput);
        setDrafts([draft, ...getDrafts()]);
        return draft;
      }

      function updateDraft(draftId, updates) {
        const drafts = getDrafts().map((draft) => (draft.id === draftId ? { ...draft, ...updates } : draft));
        setDrafts(drafts);
      }

      function discardDraft(draftId) {
        setDrafts(getDrafts().filter((draft) => draft.id !== draftId));
      }

      function approveDraft(draftId, updates = {}) {
        const draft = getDrafts().find((item) => item.id === draftId);
        if (!draft) return;
        pushDraftDecision(draft, 'approved');
        const merged = { ...draft, ...updates };
        const entry = createEntry({
          matterId: merged.matterId,
          date: merged.date,
          rawSeconds: Math.max(0, Math.round(Number(merged.estimatedSeconds) || 0)),
          description: merged.description.trim() || `${DRAFT_SOURCE_LABELS[merged.source] || 'Draft'} entry.`,
          type: merged.source,
          billable: merged.billable,
        });
        setEntries([entry, ...getEntries()]);
        discardDraft(draftId);
      }

      function calcBilledHours(rawSeconds, increment = 0.1) {
        if (rawSeconds <= 0) return 0;
        const rawHours = rawSeconds / 3600;
        return Number((Math.ceil(rawHours / increment) * increment).toFixed(4));
      }

      function getMatterById(matterId) {
        return getMatters().find((matter) => matter.id === matterId) || null;
      }

      function getClientById(clientId) {
        return getClients().find((client) => client.id === clientId) || null;
      }

      function getMatterRate(matterId) {
        const matter = getMatterById(matterId);
        return matter && matter.rateOverride != null ? Number(matter.rateOverride) : Number(getSettings().defaultRate);
      }

      function calcDollars(billedHours, matterId) {
        const rate = getMatterRate(matterId);
        return Number((billedHours * rate).toFixed(2));
      }

      function createEntry({ matterId, date, rawSeconds, description, type, billable }) {
        const billedHours = calcBilledHours(rawSeconds, getSettings().increment);
        return {
          id: generateId('entry'),
          matterId,
          date,
          rawSeconds,
          billedHours,
          description,
          type,
          billable,
          dollars: billable ? calcDollars(billedHours, matterId) : 0,
          createdAt: Date.now(),
          syncedTo: null,
        };
      }

      function formatHours(hours) {
        return `${Number(hours || 0).toFixed(1)} hrs`;
      }

      function formatHoursNumber(hours) {
        return Number(hours || 0).toFixed(1);
      }

      function formatDollars(amount) {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD',
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }).format(Number(amount || 0));
      }

      function formatRawDuration(totalSeconds) {
        const seconds = Math.max(0, Math.floor(totalSeconds || 0));
        const hours = String(Math.floor(seconds / 3600)).padStart(2, '0');
        const minutes = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
        const secs = String(seconds % 60).padStart(2, '0');
        return `${hours}:${minutes}:${secs}`;
      }

      function formatDateLabel(dateString) {
        if (!dateString) return '';
        const date = new Date(`${dateString}T12:00:00`);
        return date.toLocaleDateString('en-US', {
          month: 'short',
          day: 'numeric',
          year: 'numeric',
        });
      }

      function todayKey() {
        return new Date().toISOString().slice(0, 10);
      }

      function startOfWeekKey() {
        const now = new Date();
        const day = now.getDay();
        const offset = day === 0 ? 6 : day - 1;
        now.setDate(now.getDate() - offset);
        return now.toISOString().slice(0, 10);
      }

      function startOfMonthKey() {
        const now = new Date();
        now.setDate(1);
        return now.toISOString().slice(0, 10);
      }

      function resolveLogStartDate() {
        switch (getSettings().logStartDefault) {
          case 'today':
            return todayKey();
          case 'week':
            return startOfWeekKey();
          case 'month':
            return startOfMonthKey();
          default:
            return '';
        }
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function getTimerTotalSeconds(timer, now = Date.now()) {
        if (!timer.running) return timer.accumulatedSeconds;
        return timer.accumulatedSeconds + Math.max(0, (now - timer.startEpoch) / 1000);
      }

      function pauseAllTimers(exceptId = null) {
        const now = Date.now();
        const timers = getTimers().map((timer) => {
          if (!timer.running || timer.id === exceptId) return timer;
          return {
            ...timer,
            running: false,
            accumulatedSeconds: getTimerTotalSeconds(timer, now),
          };
        });
        setTimers(timers);
        return timers;
      }

      function toggleTimerBillable(timerId, billable) {
        const timers = getTimers().map((timer) => (timer.id === timerId ? { ...timer, billable } : timer));
        setTimers(timers);
        renderAll();
        showToast(`Timer marked ${billable ? 'billable' : 'non-billable'}.`, 'success');
      }

      function createTimer({ matterId, description, billable }) {
        pauseAllTimers();
        const now = Date.now();
        const timers = getTimers();
        timers.unshift({
          id: generateId('timer'),
          matterId,
          description,
          startEpoch: now,
          accumulatedSeconds: 0,
          running: true,
          billable,
        });
        setTimers(timers);
        const settings = getSettings();
        if (!settings.onboardingDismissed) {
          settings.onboardingDismissed = true;
          setSettings(settings);
        }
        renderAll();
        showToast('Timer started. Any other running timer was auto-paused.', 'success');
      }

      function pauseTimer(timerId) {
        const now = Date.now();
        const timers = getTimers().map((timer) => {
          if (timer.id !== timerId || !timer.running) return timer;
          return {
            ...timer,
            running: false,
            accumulatedSeconds: getTimerTotalSeconds(timer, now),
          };
        });
        setTimers(timers);
        renderAll();
        showToast('Timer paused.', 'success');
      }

      function resumeTimer(timerId) {
        pauseAllTimers(timerId);
        const now = Date.now();
        const timers = getTimers().map((timer) => {
          if (timer.id !== timerId) return timer;
          return {
            ...timer,
            running: true,
            startEpoch: now,
          };
        });
        setTimers(timers);
        renderAll();
        showToast('Timer resumed.', 'success');
      }

      function stopTimer(timerId) {
        const now = Date.now();
        const timers = getTimers();
        const timer = timers.find((item) => item.id === timerId);
        if (!timer) return;
        const rawSeconds = Math.round(getTimerTotalSeconds(timer, now));
        const description = timer.description.trim() || 'Legal work session.';
        const entry = createEntry({
          matterId: timer.matterId,
          date: todayKey(),
          rawSeconds,
          description,
          type: 'timer',
          billable: timer.billable,
        });
        setEntries([entry, ...getEntries()]);
        setTimers(timers.filter((item) => item.id !== timerId));
        renderAll();
        showToast(`Logged ${formatRawDuration(rawSeconds)} raw as ${formatHours(entry.billedHours)}.`, 'success');
      }

        setTimers(getTimers().filter((timer) => timer.id !== timerId));

      function parseAnalysisJson(text) {
        let raw = String(text || '').trim();
        const fenced = raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
        if (fenced) raw = fenced[1].trim();
        const start = raw.indexOf('{');
        const end = raw.lastIndexOf('}');
        if (start === -1 || end === -1 || end < start) {
          throw new Error('Claude did not return a readable result. Try again.');
        }
        const parsed = JSON.parse(raw.slice(start, end + 1));
        if (!EMAIL_TIER_LABELS[parsed.tier]) {
          throw new Error('Claude returned an unrecognized billing tier. Try again.');
        }
        const hours = Number(parsed.suggestedHours);
        return {
          tier: parsed.tier,
          suggestedHours: Number.isFinite(hours) && hours > 0 ? hours : Number(getSettings().emailDefaults[parsed.tier] || 0.1),
          narrative: String(parsed.narrative || '').trim(),
          reasoning: String(parsed.reasoning || '').trim(),
        };
      }

      async function analyzeEmailWithClaude(emailText) {
        const settings = getSettings();
        const apiKey = settings.anthropicApiKey.trim();
        if (!apiKey) throw new Error('NO_API_KEY');

        const tierLines = Object.entries(EMAIL_TIER_LABELS)
          .map(([key, label]) => `- "${key}": ${label} (typical default ${settings.emailDefaults[key]} hrs)`)
          .join('\n');

        const system = `You are a legal billing assistant for a practicing attorney. Read the email and:\n1. Classify the attorney's work on it into exactly one billing tier (use the tier key).\n2. Suggest billable time in decimal hours, using the tier default as a starting point and adjusting for the email's length and complexity.\n3. Draft a concise, professional billing narrative in past tense describing the work (e.g., "Reviewed and responded to client correspondence regarding discovery deadlines."). Do not invent facts not present in the email.\n\nAvailable tiers:\n${tierLines}\n\nRespond with ONLY a JSON object, no prose, no code fences:\n{"tier": "<tierKey>", "suggestedHours": <number>, "narrative": "<string>", "reasoning": "<one short sentence>"}`;

        let response;
        try {
          response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'x-api-key': apiKey,
              'anthropic-version': '2023-06-01',
              'anthropic-dangerous-direct-browser-access': 'true',
            },
            body: JSON.stringify({
              model: AI_MODEL,
              max_tokens: 1024,
              system,
              messages: [{ role: 'user', content: `Email to analyze:\n\n${emailText}` }],
            }),
          });
        } catch (networkErr) {
          throw new Error('Could not reach the Anthropic API. Check your internet connection.');
        }

        if (!response.ok) {
          let detail = '';
          try {
            const errBody = await response.json();
            detail = errBody && errBody.error ? errBody.error.message : '';
          } catch (ignore) {}
          if (response.status === 401) throw new Error('Anthropic rejected the API key. Check it in Settings.');
          if (response.status === 429) throw new Error('Rate limited by Anthropic. Wait a moment and try again.');
          throw new Error(`Anthropic API error (${response.status})${detail ? `: ${detail}` : ''}`);
        }

        const data = await response.json();
        const text = (data.content || []).map((block) => block.text || '').join('');
        return parseAnalysisJson(text);
      }

      async function runEmailAnalysis() {
        const input = document.getElementById('ai-email-input');
        const resultEl = document.getElementById('ai-analysis-result');
        if (!input || !resultEl) return;
        const text = input.value.trim();
        if (!text) {
          showToast('Paste an email to analyze first.', 'error');
          return;
        }
        if (!getSettings().anthropicApiKey.trim()) {
          showToast('Add your Anthropic API key in Settings first.', 'error');
          openHelpModal('anthropicApiKey');
          return;
        }
        state.emailAnalysis = { loading: true };
        resultEl.innerHTML = renderAnalysisResultHtml(state.emailAnalysis);
        try {
          state.emailAnalysis = await analyzeEmailWithClaude(text);
          showToast('Analysis complete.', 'success');
        } catch (err) {
          state.emailAnalysis = { error: err && err.message ? err.message : 'Analysis failed. Try again.' };
        }
        const el = document.getElementById('ai-analysis-result');
        if (el) el.innerHTML = renderAnalysisResultHtml(state.emailAnalysis);
      }

      function sendAnalysisToReview() {
        const analysis = state.emailAnalysis;
        if (!analysis || analysis.error || analysis.loading) return;
        const matterSelect = document.getElementById('email-matter');
        const dateInput = document.getElementById('email-date');
        addDraft({
          source: 'email',
          matterId: matterSelect ? matterSelect.value : null,
          date: dateInput ? dateInput.value : todayKey(),
          estimatedSeconds: Math.round((Number(analysis.suggestedHours) || 0) * 3600),
          description: analysis.narrative,
          billable: true,
          evidence: analysis.reasoning ? `Claude: ${analysis.reasoning}` : '',
        });
        renderAll();
        showToast('Sent to Review. Approve it from the Review tab.', 'success');
      }

      function applyAnalysisToForm() {
        const analysis = state.emailAnalysis;
        if (!analysis || analysis.error || analysis.loading) return;
        const tierSelect = document.getElementById('email-type');
        const description = document.getElementById('email-description');
        const hoursInput = document.getElementById('email-hours');
        if (tierSelect) tierSelect.value = analysis.tier;
        if (description) description.value = analysis.narrative;
        if (hoursInput) hoursInput.value = analysis.suggestedHours.toFixed(1);
        showToast('Applied to the log form. Review, then click Log Email Entry.', 'success');
        if (description) description.scrollIntoView({ behavior: 'smooth', block: 'center' });

      /* ----------------------------------------------------------------
         Notion activity source. Pulls tasks completed today from a Notion
         database, estimates billable time (Claude, with a timestamp
         heuristic fallback), maps each to a matter, and lands them in the
         Review hub via addDraft({ source: 'notion', ... }). Live sync runs
         server-side through the LexClock backend (Notion's API blocks
         direct browser calls / CORS); "Try sample tasks" exercises the
         full pipeline locally without connecting.
      ---------------------------------------------------------------- */

      // Shape mirrors what mapNotionPage() produces from a real API page,
      // so the sample path and live path feed the exact same pipeline.
      const SAMPLE_NOTION_TASKS = [
        {
          id: 'sample_1',
          title: 'Draft motion to dismiss for Acme — personal jurisdiction',
          matterHint: 'Acme',
          createdTime: new Date(Date.now() - 95 * 60000).toISOString(),
          lastEditedTime: new Date(Date.now() - 5 * 60000).toISOString(),
        },
        {
          id: 'sample_2',
          title: 'Call with opposing counsel re: settlement terms',
          matterHint: 'Acme',
          createdTime: new Date(Date.now() - 40 * 60000).toISOString(),
          lastEditedTime: new Date(Date.now() - 18 * 60000).toISOString(),
        },
        {
          id: 'sample_3',
          title: 'Review lease amendment redlines and send comments to client',
          matterHint: 'Brightwave',
          createdTime: new Date(Date.now() - 70 * 60000).toISOString(),
          lastEditedTime: new Date(Date.now() - 35 * 60000).toISOString(),
        },
        {
          id: 'sample_4',
          title: 'Research case law on non-compete enforceability',
          matterHint: '',

      async function notionApiQuery(token, databaseId) {
        // Query the database for pages edited today, newest first.
        const start = new Date();
        start.setHours(0, 0, 0, 0);
        let response;
        try {
          response = await fetch(`https://api.notion.com/v1/databases/${databaseId}/query`, {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              authorization: `Bearer ${token}`,
              'Notion-Version': '2022-06-28',
            },
            body: JSON.stringify({
              page_size: 25,
              sorts: [{ timestamp: 'last_edited_time', direction: 'descending' }],
              filter: { timestamp: 'last_edited_time', last_edited_time: { on_or_after: start.toISOString() } },
            }),
          });
        } catch (networkErr) {
          // Browser CORS block surfaces as a TypeError here.
          throw new Error('NOTION_CORS');
        }
        if (!response.ok) {
          let detail = '';
          try {
            const body = await response.json();
            detail = body && body.message ? body.message : '';
          } catch (ignore) {}
          if (response.status === 401) throw new Error('Notion rejected the token. Check it in Settings.');
          if (response.status === 404) throw new Error('Database not found. Confirm the Database ID and that the DB is shared with the LexClock integration.');
          throw new Error(`Notion API error (${response.status})${detail ? `: ${detail}` : ''}`);
        }
        const data = await response.json();
        return Array.isArray(data.results) ? data.results : [];
      }

      function extractNotionTitle(page) {
        const props = (page && page.properties) || {};
        for (const key of Object.keys(props)) {
          const prop = props[key];
          if (prop && prop.type === 'title' && Array.isArray(prop.title)) {
            return prop.title.map((t) => t.plain_text || '').join('').trim();
          }
        }
        return '';
      }

      function extractNotionProp(page, propName) {
        if (!propName) return '';
        const prop = page && page.properties && page.properties[propName];
        if (!prop) return '';
        if (prop.type === 'select') return (prop.select && prop.select.name) || '';
        if (prop.type === 'multi_select') return (prop.multi_select || []).map((o) => o.name).join(', ');
        if (prop.type === 'rich_text') return (prop.rich_text || []).map((t) => t.plain_text || '').join('').trim();
        if (prop.type === 'title') return (prop.title || []).map((t) => t.plain_text || '').join('').trim();
        if (prop.type === 'people') return (prop.people || []).map((p) => p.name || '').join(', ');
        return '';
      }

      function mapNotionPage(page) {
        const matterProp = getSettings().notionMatterProperty.trim();
        return {
          id: page.id,
          title: extractNotionTitle(page),
          matterHint: extractNotionProp(page, matterProp),
          createdTime: page.created_time || null,
          lastEditedTime: page.last_edited_time || null,
        };
      }

      // Reusable matter matcher: find the best matter whose client or
      // matter name appears in the supplied text. Mirrors parseQuickCapture.
      function matchMatterByText(text) {
        const lower = String(text || '').toLowerCase();
        const matters = getMatters();
        let best = null;
        matters.forEach((matter) => {
          const display = getDisplayMatter(matter.id);
          [display.clientName, matter.name].forEach((candidate) => {
            const needle = String(candidate || '').toLowerCase().trim();
            if (!needle || needle === 'general' || needle === 'general matters') return;
            if (lower.includes(needle) && (!best || needle.length > best.len)) {
              best = { id: matter.id, len: needle.length };
            }
          });
        });
        if (best) return { matterId: best.id, matched: true };
        return { matterId: (matters[0] && matters[0].id) || null, matched: false };
      }

      // No-AI fallback: estimate minutes from the edit span, clamped to a
      // sane billing range; narrative is the cleaned task title.
      function heuristicTaskEstimate(task) {
        let minutes = 15;
        if (task.createdTime && task.lastEditedTime) {
          const span = (new Date(task.lastEditedTime) - new Date(task.createdTime)) / 60000;
          if (Number.isFinite(span) && span > 0) minutes = Math.min(240, Math.max(6, Math.round(span)));
        }
        let narrative = String(task.title || '').trim();
        if (narrative) narrative = narrative.charAt(0).toUpperCase() + narrative.slice(1);
        return { minutes, narrative: narrative || 'Notion task', confidence: 0.4, reasoning: 'Estimated from task edit span.' };
      }

      async function estimateTaskWithClaude(task) {
        const apiKey = getSettings().anthropicApiKey.trim();
        if (!apiKey) throw new Error('NO_API_KEY');
        const spanMin = task.createdTime && task.lastEditedTime
          ? Math.round((new Date(task.lastEditedTime) - new Date(task.createdTime)) / 60000)
          : null;
        const system = `You are a legal billing assistant. Given a completed task from an attorney's task tracker, estimate the billable time and write the billing narrative.\n1. Estimate billable minutes (integer). Use the elapsed editing span as a loose signal but apply legal judgment about how long the described work realistically takes.\n2. Write a concise past-tense billing narrative describing the legal work (e.g., "Drafted motion to dismiss regarding personal jurisdiction."). Do not invent facts beyond the task title.\n3. Give a confidence between 0 and 1.\nRespond with ONLY a JSON object, no prose, no code fences:\n{"minutes": <integer>, "narrative": "<string>", "confidence": <number>, "reasoning": "<one short sentence>"}`;
        const userContent = `Task title: ${task.title}\nElapsed editing span: ${spanMin == null ? 'unknown' : spanMin + ' minutes'}`;
        let response;
        try {
          response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'x-api-key': apiKey,
              'anthropic-version': '2023-06-01',
              'anthropic-dangerous-direct-browser-access': 'true',
            },
            body: JSON.stringify({
              model: AI_MODEL,
              max_tokens: 512,
              system,
              messages: [{ role: 'user', content: userContent }],
            }),
          });
        } catch (networkErr) {
          throw new Error('Could not reach the Anthropic API.');
        }
        if (!response.ok) {
          if (response.status === 401) throw new Error('Anthropic rejected the API key.');
          throw new Error(`Anthropic API error (${response.status}).`);
        }
        const data = await response.json();
        const text = (data.content || []).map((b) => b.text || '').join('');
        let raw = text.trim();
        const fenced = raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
        if (fenced) raw = fenced[1].trim();
        const s = raw.indexOf('{');
        const e = raw.lastIndexOf('}');
        if (s === -1 || e === -1) throw new Error('Claude returned an unreadable estimate.');
        const parsed = JSON.parse(raw.slice(s, e + 1));
        const minutes = Math.max(1, Math.round(Number(parsed.minutes) || 0));
        const conf = Number(parsed.confidence);
        return {
          minutes,
          narrative: String(parsed.narrative || task.title || '').trim(),
          confidence: Number.isFinite(conf) ? Math.max(0, Math.min(1, conf)) : null,
          reasoning: String(parsed.reasoning || '').trim(),
        };
      }

      // The credential the backend accepts: a Supabase session JWT when the user
      // is logged in, otherwise the manually-entered lxk_ API key.
      function backendCredential() {
        if (AUTH_ENABLED && authToken()) return authToken();
        return getSettings().apiKey;
      }

      function backendConfigured() {
        const settings = getSettings();
        return Boolean(settings.apiBaseUrl && backendCredential());
      }

      async function backendFetch(path, { method = 'GET', body = null } = {}) {
        const settings = getSettings();
        const base = settings.apiBaseUrl.replace(/\/+$/, '');
        const headers = { authorization: `Bearer ${backendCredential()}` };
        if (body != null) headers['content-type'] = 'application/json';
        let res;
        try {
          res = await fetch(`${base}${path}`, {
            method,
            headers,
            body: body == null ? undefined : JSON.stringify(body),
          });
        } catch (err) {
          throw new Error('Could not reach the LexClock backend. Check the Backend URL in Settings.');
        }
        let data = null;
        try {
          data = await res.json();
        } catch (_) {
          data = null;
        }
        if (!res.ok) {
          // An expired session token returns 401. If we were authenticating with
          // a Supabase session (not a static API key), try to recover silently;
          // if the session is truly gone, revalidateSession surfaces the sign-in
          // screen so the user is never stranded on a stale page.
          if (res.status === 401 && AUTH_ENABLED && authToken()) {
            const stillIn = await revalidateSession();
            if (!stillIn) throw new Error('Your session expired. Please sign in again.');
          }
          const detail = (data && (data.error || data.message)) || `Request failed (${res.status}).`;
          throw new Error(detail);
        }
        return data;
      }

      // After a server-side Google OAuth callback redirects back to /app/ with a
      // ?gmail=... or ?calendar=... flag, surface the result and then reconcile
      // the local connected state with the backend (the source of truth).
      // Idempotent: safe to call on every load / auth-state change.
      async function syncGmailConnection() {
        const params = new URLSearchParams(window.location.search);
        const labels = { gmail: 'Gmail', calendar: 'Google Calendar', outlook: 'Outlook' };
        let dirty = false;
        for (const provider of ['gmail', 'calendar', 'outlook']) {
          const flag = params.get(provider);
          if (!flag) continue;
          params.delete(provider);
          dirty = true;
          const label = labels[provider];
          if (flag === 'connected') showToast(`${label} connected.`, 'success');
          else if (flag === 'denied') showToast(`${label} connection cancelled.`, 'error');
          else if (flag === 'norefresh') showToast(provider === 'outlook'
            ? 'Microsoft didn’t return a refresh token. Remove LexClock at microsoft.com/consent, then reconnect.'
            : 'Google didn’t return a refresh token. Remove LexClock at myaccount.google.com/permissions, then reconnect.', 'error');
          else if (flag === 'error') showToast(`${label} connection failed. Please try again.`, 'error');
        }
        if (dirty) {
          const qs = params.toString();
          const clean = window.location.pathname + (qs ? `?${qs}` : '') + window.location.hash;
          window.history.replaceState({}, '', clean);
        }
        if (!backendConfigured()) return;
        const settings = getSettings();
        let changed = false;
        try {
          const status = await backendFetch('/api/email/status');
          const connected = !!(status && status.connected);
          if (settings.gmailConnected !== connected) {
            settings.gmailConnected = connected;
            if (!connected) settings.gmailEmail = '';
            changed = true;
          }
        } catch (_) { /* backend unreachable: keep local state as-is */ }
        try {
          const status = await backendFetch('/api/calendar/status');
          const connected = !!(status && status.connected);
          if (settings.calendarConnected !== connected) {
            settings.calendarConnected = connected;
            if (!connected) settings.calendarEmail = '';
            changed = true;
          }
        } catch (_) { /* backend unreachable: keep local state as-is */ }
        try {
          const status = await backendFetch('/api/outlook/status');
          const connected = !!(status && status.connected);
          if (settings.outlookConnected !== connected) {
            settings.outlookConnected = connected;
            if (!connected) settings.outlookEmail = '';
            changed = true;
          }
        } catch (_) { /* backend unreachable: keep local state as-is */ }
        if (changed) { saveSettings(settings); renderAll(); }
      }

      // Best-effort: tell the backend a draft was approved/discarded so server
      // status + audit log stay accurate. Never blocks or breaks local UX.
      function pushDraftDecision(draft, status) {
        if (!draft || !draft.backendId || !backendConfigured()) return;
        backendFetch('/api/drafts', { method: 'POST', body: { id: draft.backendId, status } }).catch(() => {});
      }

      async function testBackendConnection() {
        if (!backendConfigured()) {
          showToast('Add your Backend URL and API key first.', 'error');
          return;
        }
        showToast('Testing backend…', '');
        try {
          const health = await backendFetch('/api/health');
          const cfg = (health && health.config) || {};
          await backendFetch('/api/drafts?status=pending'); // validates the API key
          const warn = [];
          if (!cfg.supabase) warn.push('database not configured');
          if (!cfg.anthropic) warn.push('no AI key (heuristic estimates only)');
          showToast(warn.length ? `Backend connected — ${warn.join(', ')}.` : 'Backend connected and API key valid.', warn.length ? '' : 'success');
        } catch (err) {
          showToast((err && err.message) || 'Backend test failed.', 'error');
        }
      }

      async function syncNotionViaBackend(sample) {
        const settings = getSettings();
        const token = settings.notionToken.trim();
        const dbId = settings.notionDatabaseId.trim();
        if (!token || !dbId) {
          throw new Error('Add your Notion token and Database ID in Settings first.');
        }
        await backendFetch('/api/notion/connect', {
          method: 'POST',
          body: {
            token,
            databaseId: dbId,
            matterProperty: settings.notionMatterProperty.trim() || undefined,
          },
        });
        const sync = await backendFetch('/api/notion/sync', { method: 'POST', body: {} });
        const list = await backendFetch('/api/drafts?status=pending');
        const remoteDrafts = (list && list.drafts) || [];
        const existingExternal = new Set(
          getDrafts().map((d) => d.externalId).filter(Boolean)
        );
        let created = 0;
        for (const rd of remoteDrafts) {
          const ext = rd.external_id;
          if (ext && existingExternal.has(ext)) continue;
          addDraft({
            source: 'notion',
            matterId: matchMatterByText(`${rd.evidence || ''} ${rd.description || ''}`).matterId,
            date: rd.entry_date || todayKey(),
            estimatedSeconds: Number(rd.estimated_seconds) || 0,
            description: rd.description || '',
            billable: rd.billable !== false,
            confidence: rd.confidence == null ? null : Number(rd.confidence),
            evidence: rd.evidence || '',
            externalId: ext || null,
            backendId: rd.id || null,
          });
          if (ext) existingExternal.add(ext);
          created += 1;
        }
        state.notionSync = {
          done: true,
          sample: false,
          created,
          backend: true,
          serverTotal: (sync && sync.total) || remoteDrafts.length,
          serverCreated: (sync && sync.created) || 0,
        };
        renderReviewView();
        renderShell();
        showToast(`${created} Notion ${created === 1 ? 'task' : 'tasks'} added to Review.`, 'success');
      }

      async function syncNotionTasks({ sample = false } = {}) {
        const settings = getSettings();
        state.notionSync = { loading: true, sample };
        renderReviewView();

        if (!sample && backendConfigured()) {
          try {
            await syncNotionViaBackend(sample);
          } catch (err) {
            state.notionSync = { error: (err && err.message) || 'Notion sync failed.', sample };
            renderReviewView();
          }
          return;
        }

        let tasks = [];
        try {
          if (sample) {
            tasks = SAMPLE_NOTION_TASKS.slice();
          } else {
            const token = settings.notionToken.trim();
            const dbId = settings.notionDatabaseId.trim();
            if (!token || !dbId) {
              throw new Error('Add your Notion token and Database ID in Settings first.');
            }
            const pages = await notionApiQuery(token, dbId);
            tasks = pages.map(mapNotionPage).filter((t) => t.title);
          }
        } catch (err) {
          const message = err && err.message === 'NOTION_CORS'
            ? 'Notion blocks direct browser calls (CORS). A live sync needs the LexClock backend — add your Backend URL + API key in Settings, or use "Try sample tasks" to preview the pipeline now.'
            : (err && err.message) || 'Notion sync failed.';
          state.notionSync = { error: message, sample };
          renderReviewView();
          return;
        }

        if (!tasks.length) {
          state.notionSync = { error: 'No tasks completed today were found in that database.', sample };
          renderReviewView();
          return;
        }

        const hasKey = Boolean(settings.anthropicApiKey.trim());
        let created = 0;
        let aiUsed = 0;
        for (const task of tasks.slice(0, 12)) {
          let est;
          if (hasKey) {
            try {
              est = await estimateTaskWithClaude(task);
              aiUsed += 1;
            } catch (estErr) {
              est = heuristicTaskEstimate(task);
            }
          } else {
            est = heuristicTaskEstimate(task);
          }
          const matterText = `${task.matterHint || ''} ${task.title || ''}`;
          const { matterId } = matchMatterByText(matterText);
          const evidenceBits = [`Notion task: "${task.title}"`];
          if (task.matterHint) evidenceBits.push(`Matter hint: ${task.matterHint}`);
          if (est.reasoning) evidenceBits.push(est.reasoning);
          addDraft({
            source: 'notion',
            matterId,
            date: todayKey(),
            estimatedSeconds: Math.round((Number(est.minutes) || 0) * 60),
            description: est.narrative,
            billable: true,
            confidence: est.confidence,
            evidence: evidenceBits.join(' · '),
          });
          created += 1;
        }

        state.notionSync = {
          done: true,
          sample,
          created,
          aiUsed,
          usedAi: hasKey,
        };
        renderReviewView();
        renderShell();
        showToast(`${created} Notion ${created === 1 ? 'task' : 'tasks'} added to Review.`, 'success');
      }

      function renderNotionSyncStatusHtml() {
        const sync = state.notionSync;
        if (!sync) return '';
        if (sync.loading) {
          return `<div class="notion-status notion-status-loading">Pulling ${sync.sample ? 'sample ' : ''}Notion tasks${sync.sample ? '' : ' and estimating time'}…</div>`;
        }
        if (sync.error) {
          return `<div class="notion-status notion-status-error">${escapeHtml(sync.error)}</div>`;
        }
        if (sync.done) {
          if (sync.backend) {
            const total = sync.serverTotal || 0;
            if (sync.created === 0) {
              return `<div class="notion-status notion-status-ok">Synced with your backend — ${total} ${total === 1 ? 'task' : 'tasks'} processed server-side, nothing new to add. Estimates ran on the server.</div>`;
            }
            return `<div class="notion-status notion-status-ok">Added ${sync.created} ${sync.created === 1 ? 'draft' : 'drafts'} below (of ${total} synced server-side). Estimates ran on the server. Review and approve each before it bills.</div>`;
          }
          const how = sync.usedAi
            ? `Claude estimated ${sync.aiUsed} of ${sync.created}.`
            : 'Estimated from edit spans (add an Anthropic key for AI estimates + narratives).';
          return `<div class="notion-status notion-status-ok">Added ${sync.created} ${sync.sample ? 'sample ' : ''}${sync.created === 1 ? 'draft' : 'drafts'} below. ${escapeHtml(how)} Review and approve each before it bills.</div>`;
        }
        return '';
      }

      function parseLintJson(text) {
        let raw = String(text || '').trim();
        const fenced = raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
        if (fenced) raw = fenced[1].trim();
        const start = raw.indexOf('{');
        const end = raw.lastIndexOf('}');
        if (start === -1 || end === -1 || end < start) {
          throw new Error('Claude did not return a readable result. Try again.');
        }
        const parsed = JSON.parse(raw.slice(start, end + 1));
        const score = Math.max(0, Math.min(100, Math.round(Number(parsed.score))));
        return {
          score: Number.isFinite(score) ? score : 0,
          issues: Array.isArray(parsed.issues) ? parsed.issues.map((i) => String(i)).filter(Boolean).slice(0, 5) : [],
          improved: String(parsed.improved || '').trim(),
        };
      }

      async function lintDescriptionWithClaude(description) {
        const apiKey = getSettings().anthropicApiKey.trim();
        if (!apiKey) throw new Error('NO_API_KEY');

        const system = `You are a legal billing description coach. Law firm clients and billing partners write down or reject time-entry narratives that are vague ("attention to file"), use block billing (multiple tasks lumped together), are in the wrong tense, or sound non-billable (clerical/administrative phrasing). Given one time-entry description, evaluate how billing-ready it is and rewrite it.\n\nRules for the rewrite:\n- Past tense, professional, specific about the legal task performed.\n- One discrete task per entry (no block billing).\n- Do NOT invent facts, parties, or details not implied by the original. If the original is too sparse to know specifics, keep it general but well-phrased.\n- Keep it concise (one sentence is ideal).\n\nRespond with ONLY a JSON object, no prose, no code fences:\n{"score": <0-100 integer, how billing-ready the ORIGINAL is>, "issues": ["<short issue>", ...], "improved": "<rewritten narrative>"}`;

        let response;
        try {
          response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'x-api-key': apiKey,
              'anthropic-version': '2023-06-01',
              'anthropic-dangerous-direct-browser-access': 'true',
            },
            body: JSON.stringify({
              model: AI_MODEL,
              max_tokens: 512,
              system,
              messages: [{ role: 'user', content: `Time-entry description to evaluate:\n\n${description}` }],
            }),
          });
        } catch (networkErr) {
          throw new Error('Could not reach the Anthropic API. Check your internet connection.');
        }

        if (!response.ok) {
          let detail = '';
          try {
            const errBody = await response.json();
            detail = errBody && errBody.error ? errBody.error.message : '';
          } catch (ignore) {}
          if (response.status === 401) throw new Error('Anthropic rejected the API key. Check it in Settings.');
          if (response.status === 429) throw new Error('Rate limited by Anthropic. Wait a moment and try again.');
          throw new Error(`Anthropic API error (${response.status})${detail ? `: ${detail}` : ''}`);
        }

        const data = await response.json();
        const text = (data.content || []).map((block) => block.text || '').join('');
        return parseLintJson(text);
      }

      function renderLintResultHtml(draftId) {
        const lint = state.draftLint[draftId];
        if (!lint) return '';
        if (lint.loading) return `<div class="draft-lint-body loading">Checking the narrative&hellip;</div>`;
        if (lint.error) return `<div class="draft-lint-body error">${escapeHtml(lint.error)}</div>`;
        const result = lint.result;
        const tone = result.score >= 80 ? 'good' : result.score >= 50 ? 'warn' : 'bad';
        return `
          <div class="draft-lint-body">
            <div class="lint-head">
              <span class="lint-score lint-${tone}">${result.score}/100 billing-ready</span>
            </div>
            ${
              result.issues.length
                ? `<ul class="lint-issues">${result.issues.map((i) => `<li>${escapeHtml(i)}</li>`).join('')}</ul>`
                : `<p class="helper-text">No major issues flagged.</p>`
            }
            ${
              result.improved
                ? `
                  <div class="lint-suggestion">
                    <span class="meta-text">Suggested rewrite</span>
                    <p>${escapeHtml(result.improved)}</p>

      async function runDraftLint(draftId) {
        const card = document.querySelector(`form.draft-card[data-draft-id="${draftId}"]`);
        if (!card) return;
        const description = card.description.value.trim();
        if (!description) {
          showToast('Add a description before polishing it.', 'error');
          return;
        }
        if (!getSettings().anthropicApiKey.trim()) {
          showToast('Add your Anthropic API key in Settings first.', 'error');
          openHelpModal('anthropicApiKey');
          return;
        }
        state.draftLint[draftId] = { loading: true };
        const container = document.getElementById(`lint-${draftId}`);
        if (container) container.innerHTML = renderLintResultHtml(draftId);
        try {
          const result = await lintDescriptionWithClaude(description);
          state.draftLint[draftId] = { result };
        } catch (err) {
          if (err && err.message === 'NO_API_KEY') {
            state.draftLint[draftId] = { error: 'Add your Anthropic API key in Settings first.' };
          } else {
            state.draftLint[draftId] = { error: err && err.message ? err.message : 'Check failed. Try again.' };
          }
        }
        const el = document.getElementById(`lint-${draftId}`);
        if (el) el.innerHTML = renderLintResultHtml(draftId);
      }

      function applyDraftLint(draftId) {
        const lint = state.draftLint[draftId];
        if (!lint || !lint.result || !lint.result.improved) return;
        const card = document.querySelector(`form.draft-card[data-draft-id="${draftId}"]`);
        if (card && card.description) {
          card.description.value = lint.result.improved;
          showToast('Rewrite applied. Save or approve to keep it.', 'success');

      function getDisplayMatter(matterId) {
        const matter = getMatterById(matterId);
        if (!matter) {

      function collectTotals(entries) {
        return entries.reduce(
          (accumulator, entry) => {
            if (!entry.billable) return accumulator;
            accumulator.hours += Number(entry.billedHours || 0);
            accumulator.dollars += Number(entry.dollars || 0);
            return accumulator;
          },
          { hours: 0, dollars: 0 }
        );
      }

      function getTodayStats() {
        const today = todayKey();
        const entries = getEntries().filter((entry) => entry.date === today && entry.billable);
        const totals = collectTotals(entries);
        const timers = getTimers();
        timers.forEach((timer) => {
          if (!timer.billable) return;
          const seconds = getTimerTotalSeconds(timer);
          const billedHours = calcBilledHours(seconds, getSettings().increment);
          totals.hours += billedHours;
          totals.dollars += calcDollars(billedHours, timer.matterId);
        });
        return totals;
      }

      function getWeekStats() {
        const start = startOfWeekKey();
        const entries = getEntries().filter((entry) => entry.date >= start && entry.billable);
        return collectTotals(entries);
      }

      function getTodayLoggedHours() {
        const today = todayKey();
        const increment = getSettings().increment;
        let hours = getEntries()
          .filter((entry) => entry.date === today)
          .reduce((sum, entry) => sum + (Number(entry.billedHours) || 0), 0);
        getTimers().forEach((timer) => {
          hours += calcBilledHours(getTimerTotalSeconds(timer), increment);
        });
        return Number(hours.toFixed(2));
      }

      function getReconciliation() {
        const target = Number(getSettings().workdayTargetHours) || 0;
        const logged = getTodayLoggedHours();
        const gap = Number(Math.max(0, target - logged).toFixed(2));
        return { target, logged, gap };
      }

      function daysSince(dateKey) {
        if (!dateKey) return 0;
        const then = new Date(`${dateKey}T12:00:00`);
        const now = new Date(`${todayKey()}T12:00:00`);
        return Math.max(0, Math.round((now - then) / 86400000));
      }

      function getWipSummary() {
        const entries = getEntries().filter((entry) => entry.billable && !entry.syncedTo);
        const buckets = { recent: 0, mid: 0, old: 0 };
        const matterMap = new Map();
        let totalHours = 0;
        let totalDollars = 0;
        entries.forEach((entry) => {
          const hours = Number(entry.billedHours) || 0;
          const dollars = Number(entry.dollars) || 0;
          totalHours += hours;
          totalDollars += dollars;
          const age = daysSince(entry.date);
          if (age <= 7) buckets.recent += dollars;
          else if (age <= 30) buckets.mid += dollars;
          else buckets.old += dollars;
          const row = matterMap.get(entry.matterId) || { matterId: entry.matterId, hours: 0, dollars: 0, count: 0, oldestDays: 0 };
          row.hours += hours;
          row.dollars += dollars;
          row.count += 1;
          row.oldestDays = Math.max(row.oldestDays, age);
          matterMap.set(entry.matterId, row);
        });
        const byMatter = [...matterMap.values()].sort((a, b) => b.oldestDays - a.oldestDays || b.dollars - a.dollars);
        return {
          count: entries.length,
          totalHours: Number(totalHours.toFixed(2)),
          totalDollars: Number(totalDollars.toFixed(2)),
          buckets,
          byMatter,
        };
      }

      function parseQuickCapture(text) {
        const original = String(text || '').trim();
        const result = { hours: null, matterId: null, description: original, matchedTime: false, matchedMatter: false };
        if (!original) return result;
        let desc = original;
        let hours = 0;
        const hrMatch = original.match(/(\d+(?:\.\d+)?)\s*(?:hours?|hrs?|h)(?![a-z])/i);
        const minMatch = original.match(/(\d+(?:\.\d+)?)\s*(?:minutes?|mins?|m)(?![a-z])/i);
        if (hrMatch) {
          hours += parseFloat(hrMatch[1]);
          desc = desc.replace(hrMatch[0], ' ');
          result.matchedTime = true;
        }
        if (minMatch) {
          hours += parseFloat(minMatch[1]) / 60;
          desc = desc.replace(minMatch[0], ' ');
          result.matchedTime = true;
        }
        if (!result.matchedTime) {
          const decMatch = original.match(/(?:^|\s)(\d*\.\d+)(?=\s|$)/);
          if (decMatch) {
            hours = parseFloat(decMatch[1]);
            desc = desc.replace(decMatch[1], ' ');
            result.matchedTime = true;
          }
        }
        result.hours = result.matchedTime ? Number(hours.toFixed(2)) : null;

        const lower = original.toLowerCase();
        const matters = getMatters();
        let best = null;
        matters.forEach((matter) => {
          const display = getDisplayMatter(matter.id);
          [display.clientName, matter.name].forEach((candidate) => {
            const needle = String(candidate || '').toLowerCase().trim();
            if (!needle || needle === 'general' || needle === 'general matters') return;
            if (lower.includes(needle) && (!best || needle.length > best.len)) {
              best = { id: matter.id, len: needle.length };
            }
          });
        });
        if (best) {
          result.matterId = best.id;
          result.matchedMatter = true;
        } else {
          result.matterId = (matters[0] && matters[0].id) || null;
        }

        desc = desc.replace(/\s+/g, ' ').trim().replace(/^[\s,;:.-]+/, '').replace(/[\s,;:.-]+$/, '');
        if (desc) desc = desc.charAt(0).toUpperCase() + desc.slice(1);
        result.description = desc || original;
        return result;
      }

      function billedPreview(hours, matterId) {
        const settings = getSettings();
        const entered = Number(hours) || 0;
        const billed = calcBilledHours(entered * 3600, settings.increment);

        return { entered, billed, dollars, increment: Number(settings.increment) };

      function buildExportText(entries, startDate, endDate) {
        const settings = getSettings();
        const lawyerName = settings.lawyerName || 'UNNAMED LAWYER';
        const rangeLabel = startDate && endDate ? `${startDate} to ${endDate}` : 'All Dates';
        const grouped = new Map();

        entries
          .filter((entry) => entry.billable)
          .sort((a, b) => a.date.localeCompare(b.date) || a.createdAt - b.createdAt)
          .forEach((entry) => {
            const display = getDisplayMatter(entry.matterId);
            const groupKey = `${display.clientName}|||${display.matterName}`;
            if (!grouped.has(groupKey)) grouped.set(groupKey, []);
            grouped.get(groupKey).push({ entry, display });
          });

        const lines = [];
        lines.push('================================================');
        lines.push(`BILLING EXPORT - ${lawyerName.toUpperCase()} - ${rangeLabel}`);
        lines.push('================================================');
        lines.push('');

        grouped.forEach((items, key) => {
          const [clientName, matterName] = key.split('|||');
          lines.push(`${clientName} - ${matterName}`);
          lines.push('');
          items.forEach(({ entry }) => {
            const rate = formatDollars(getMatterRate(entry.matterId));
            lines.push(`Date:      ${entry.date}`);
            lines.push(`Time:      ${Number(entry.billedHours).toFixed(1)} hrs`);
            lines.push(`Rate:      ${rate}/hr`);
            lines.push(`Amount:    ${formatDollars(entry.dollars)}`);
            lines.push(`Narrative: ${entry.description}`);
            lines.push('------------------------------------------------');
          });
          lines.push('');
        });

        const totals = collectTotals(entries);
        lines.push(`TOTAL BILLABLE:  ${Number(totals.hours).toFixed(1)} hrs  |  ${formatDollars(totals.dollars)}`);
        lines.push('================================================');
        return lines.join('\n');
      }

      function filteredEntries() {
        const { startDate, endDate, matterId, billable } = state.logFilters;
        return getEntries()
          .filter((entry) => !startDate || entry.date >= startDate)
          .filter((entry) => !endDate || entry.date <= endDate)
          .filter((entry) => matterId === 'all' || entry.matterId === matterId)
          .filter((entry) => billable === 'all' || String(entry.billable) === billable)
          .sort((a, b) => b.createdAt - a.createdAt);
      }

        const text = document.createElement('span');
        text.textContent = message;
        toast.appendChild(text);
        let lifespan = 3000;
        if (options && options.actionLabel) {
          lifespan = 6000;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'toast-action';
          btn.textContent = options.actionLabel;
          btn.addEventListener('click', () => {
            toast.remove();
            if (typeof options.onAction === 'function') options.onAction();
          });
          toast.appendChild(btn);
        }
        container.appendChild(toast);
        window.setTimeout(() => {
          toast.remove();
        }, lifespan);

      function fireConfetti(originEl) {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const rect = originEl.getBoundingClientRect();
        const cx = rect.left + Math.min(rect.width, 140);
        const cy = rect.top + rect.height / 2;
        const colors = ['#E8842B', '#F2A341', '#2E9E6B', '#1B6FA8'];
        for (let i = 0; i < 18; i += 1) {
          const piece = document.createElement('div');
          piece.className = 'confetti-piece';
          piece.style.left = `${cx}px`;
          piece.style.top = `${cy}px`;
          piece.style.background = colors[i % colors.length];
          const angle = (Math.PI * 2 * i) / 18 + Math.random() * 0.6;
          const dist = 60 + Math.random() * 90;
          piece.style.setProperty('--cx', `${Math.cos(angle) * dist}px`);
          piece.style.setProperty('--cy', `${Math.sin(angle) * dist + 40}px`);
          piece.style.setProperty('--cr', `${Math.random() * 540 - 270}deg`);
          piece.style.animation = `confetti-fall ${600 + Math.random() * 300}ms cubic-bezier(0.2,0.7,0.2,1) forwards`;
          document.body.appendChild(piece);
          window.setTimeout(() => piece.remove(), 1000);
        }
