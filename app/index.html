        const draftId = form.dataset.draftId;
        const fields = readDraftForm(form);
        const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const dollars = draftDollars({ ...getDrafts().find((d) => d.id === draftId), ...fields });
        const finish = () => {
          approveDraft(draftId, fields);
          delete state.draftLint[draftId];
          renderAll();
          showToast(`Approved & billed to Clio — ${formatDollars(dollars)}`, 'success');
        };
        if (reduce) {
          finish();
          return;
        }
        const approveBtn = form.querySelector('.btn-approve');
        if (approveBtn) fireConfetti(approveBtn);
        form.classList.add('approving');
        window.setTimeout(() => {
          form.classList.add('leaving');
        }, 280);
        window.setTimeout(finish, 620);

      async function initiateOAuth(provider) {
        // All three providers use LexClock's server-side OAuth. We ask the
        // backend for a provider consent URL (signed with our user id AND the
        // source), then hand the browser off. The authorization code is
        // exchanged for a refresh token server-side — the token never touches the
        // browser, and background sync keeps capturing billable time after the
        // tab closes. Outlook is one Microsoft connection granting mail+calendar.
        const labels = { gmail: 'Gmail', calendar: 'Google Calendar', outlook: 'Outlook' };
        const label = labels[provider] || provider;
        if (!backendConfigured()) {
          showToast(`Sign in to LexClock before connecting ${label}.`, 'error');
          return;
        }
        const isOutlook = provider === 'outlook';
        const startPath = isOutlook ? '/api/oauth/microsoft/start' : '/api/oauth/google/start';
        const startBody = isOutlook ? {} : { source: provider };
        try {
          showToast(isOutlook ? 'Opening Microsoft…' : 'Opening Google…', '');
          const { url } = await backendFetch(startPath, { method: 'POST', body: startBody });
          if (!url) throw new Error('The server did not return an authorization URL.');
          window.location.href = url;
        } catch (err) {
          showToast(err.message || `Could not start the ${label} connection.`, 'error');
        }
      }

      // Server-side Gmail sync. The backend (using the stored refresh token)
      // pulls recently sent mail, estimates billable time with the shared
      // Anthropic key, and writes idempotent pending drafts to Postgres — the
      // message bodies never touch the browser. We then pull those drafts into
      // the Review hub. Mirrors syncNotionViaBackend so both sources share the
      // same approve-before-bill pipeline.
      async function syncGmailViaBackend() {
        if (!backendConfigured()) {
          showToast('Sign in to LexClock before syncing Gmail.', 'error');
          return;
        }
        state.gmailSync = { loading: true };
        renderAll();
        try {
          const sync = await backendFetch('/api/email/sync', { method: 'POST', body: {} });
          const list = await backendFetch('/api/drafts?status=pending');
          const remoteDrafts = (list && list.drafts) || [];
          const existingExternal = new Set(getDrafts().map((d) => d.externalId).filter(Boolean));
          let created = 0;
          for (const rd of remoteDrafts) {
            if (rd.source !== 'gmail') continue; // only surface email drafts here
            const ext = rd.external_id;
            if (ext && existingExternal.has(ext)) continue;
            addDraft({
              source: 'gmail',
              matterId: matchMatterByText(`${rd.evidence || ''} ${rd.description || ''}`).matterId,
              date: rd.entry_date || todayKey(),
              estimatedSeconds: Number(rd.estimated_seconds) || 0,
              description: rd.description || '',
              billable: rd.billable !== false,
              confidence: rd.confidence == null ? null : Number(rd.confidence),
              evidence: rd.evidence || '',
              externalId: ext || null,
              backendId: rd.id || null,
            });
            if (ext) existingExternal.add(ext);
            created += 1;
          }
          state.gmailSync = {
            done: true,
            created,
            serverCreated: (sync && sync.created) || 0,
            serverTotal: (sync && sync.total) || 0,
          };
          renderAll();
          showToast(
            created
              ? `${created} email ${created === 1 ? 'entry' : 'entries'} added to Review.`
              : 'Gmail is up to date — no new emails to bill.',
            'success'
          );
        } catch (err) {
          state.gmailSync = { error: (err && err.message) || 'Gmail sync failed.' };
          renderAll();
          showToast((err && err.message) || 'Gmail sync failed.', 'error');
        }
      }

      // Server-side Outlook sync. One Microsoft connection drives BOTH recently

      async function disconnectProvider(provider) {
        const labels = { gmail: 'Gmail', calendar: 'Google Calendar', outlook: 'Outlook' };
        const label = labels[provider] || provider;
        const confirmed = confirm(`Disconnect ${label}? Your logged billing entries will not be affected.`);
        if (!confirmed) return;

        const settings = getSettings();
        if (provider === 'gmail') {
          // Revoke + purge the server-side refresh token. Best-effort: clear
          // locally even if the backend call fails so the UI stays consistent.
          try {
            await backendFetch('/api/email/status', { method: 'DELETE' });
          } catch (_) { /* fall through to local cleanup */ }
          settings.gmailConnected = false;
          settings.gmailEmail = '';
          localStorage.removeItem('lexclock_gmail_token');
          localStorage.removeItem('lexclock_gmail_expiry');
          localStorage.removeItem('lexclock_gmail_synced_ids');
          state.gmailSync = null;
        } else if (provider === 'calendar') {
          try {
            await backendFetch('/api/calendar/status', { method: 'DELETE' });
          } catch (_) { /* fall through to local cleanup */ }
          settings.calendarConnected = false;
          settings.calendarEmail = '';
          state.calendarSync = null;
        } else {
          // Outlook: revoke + purge the server-side Microsoft refresh token.
          try {
            await backendFetch('/api/outlook/status', { method: 'DELETE' });
          } catch (_) { /* fall through to local cleanup */ }
          settings.outlookConnected = false;
          settings.outlookEmail = '';
          localStorage.removeItem('lexclock_outlook_token');
          localStorage.removeItem('lexclock_outlook_expiry');
          state.outlookSync = null;
        }

        saveSettings(settings);
        renderAll();
        showToast(`${label} disconnected`, 'success');
      }

      function confidenceTier(confidence) {
        if (confidence == null) return null;
        const pct = Math.round(Number(confidence) * 100);
        if (pct >= 85) return { cls: 'conf-high', label: 'High confidence', pct };
        if (pct >= 60) return { cls: 'conf-med', label: 'Medium', pct };
        return { cls: 'conf-low', label: 'Needs a look', pct };
      }

      function draftDollars(draft) {
        if (!draft.billable) return 0;
        const billedHours = calcBilledHours(Math.round(Number(draft.estimatedSeconds) || 0), getSettings().increment);
        return calcDollars(billedHours, draft.matterId);
      }

        const billedHours = calcBilledHours(Math.round(Number(draft.estimatedSeconds) || 0), getSettings().increment);

                  <div class="draft-desc-text">${escapeHtml(draft.description)}</div>
                  <div class="draft-chips">
                    ${tier ? `<span class="draft-chip ${tier.cls}"><span class="cdot"></span>${tier.label} · ${tier.pct}%</span>` : ''}
                    <span class="draft-chip chip-source">${escapeHtml(sourceLabel)}</span>
                    <span class="draft-chip chip-ev" data-action="show-evidence" data-draft-id="${draft.id}">${EV_ICON}${escapeHtml(evChipLabel)}</span>
                  </div>
                </div>
              </div>
              <div class="draft-actions">
                <button class="btn-approve" type="submit">${CHECK_ICON}Approve &amp; bill</button>
                <button class="btn-edit" type="button" data-action="edit-draft" data-draft-id="${draft.id}">Edit</button>
                <button class="btn-skip" type="button" data-action="discard-draft" data-draft-id="${draft.id}">Skip</button>
                <button class="draft-ev-link" type="button" data-action="show-evidence" data-draft-id="${draft.id}">Show evidence</button>
              </div>
            </div>

            <div class="draft-edit">
              <div class="form-grid">
                <div class="field-row full-span">
                  <label>Description</label>
                  <textarea name="description" rows="2">${escapeHtml(draft.description)}</textarea>
                </div>
                <div class="field-row">

                  <select name="matterId">${matterOptionsHtml(draft.matterId)}</select>
                </div>
                <div class="field-row">

                  <label>Billable</label>

                </div>

      function handleNav(event) {
        const button = event.target.closest('[data-view]');
        if (!button) return;
        showView(button.dataset.view);
      }

      function handleGlobalClick(event) {
        if (event.target.id === 'ev-scrim') {
          closeEvidenceDrawer();
          return;
        }
        const actionButton = event.target.closest('[data-action]');
        const ctaButton = event.target.closest('[data-cta-view]');

        if (ctaButton) {
          showView(ctaButton.dataset.ctaView);
          return;
        }

        const helpButton = event.target.closest('[data-help-key]');
        if (helpButton) {
          openHelpModal(helpButton.dataset.helpKey);
          return;
        }

        const connectButton = event.target.closest('[data-connect-provider]');
        if (connectButton) {
          const provider = connectButton.dataset.connectProvider;
          const action = connectButton.dataset.connectAction;
          const helpKey = connectButton.dataset.connectHelpKey;
          if (action === 'help') {
            openHelpModal(helpKey);
          } else if (action === 'oauth') {
            initiateOAuth(provider);
          }
          return;
        }

        const disconnectButton = event.target.closest('[data-disconnect-provider]');
        if (disconnectButton) {
          disconnectProvider(disconnectButton.dataset.disconnectProvider);
          return;
        }

        if (event.target.matches('[data-modal-close]') || event.target === document.getElementById('modal-root')) {
          closeModal();
          return;
        }

        if (event.target.id === 'modal-confirm-action' && state.modal && state.modal.type === 'confirm') {
          const action = state.modal.onConfirm;
          if (typeof action === 'function') action();
          return;
        }

        if (event.target.id === 'reset-log-filters') {
          state.logFilters = {
            startDate: resolveLogStartDate(),
            endDate: todayKey(),
            matterId: 'all',
            billable: 'all',
          };
          renderLogView();
          showToast('Filters reset.', 'success');
          return;
        }

        if (event.target.id === 'generate-export') {
          const entries = filteredEntries();
          state.exportText = buildExportText(entries, state.logFilters.startDate, state.logFilters.endDate);
          renderLogView();
          showToast('Billing export generated.', 'success');
          return;
        }

        if (event.target.id === 'copy-export') {
          const exportField = document.getElementById('export-text');
          const text = exportField ? exportField.value : state.exportText;
          if (!text.trim()) {
            showToast('Generate an export before copying.', 'error');
            return;
          }
          navigator.clipboard.writeText(text).then(
            () => showToast('Export copied to clipboard.', 'success'),
            () => showToast('Clipboard copy failed in this browser.', 'error')
          );
          return;
        }

        if (event.target.id === 'clear-all-data') {
          openConfirmModal({
            title: 'Clear all LexClock data?',
            message: 'This wipes settings, clients, matters, entries, and timers, then re-seeds the default General client and matter.',
            confirmLabel: 'Clear All Data',
            confirmClass: 'btn-danger',
            onConfirm: clearAllData,
          });
          return;
        }

        if (!actionButton) return;

        const { action } = actionButton.dataset;
        if (action === 'pause-timer') {
          pauseTimer(actionButton.dataset.timerId);
        } else if (action === 'resume-timer') {
          resumeTimer(actionButton.dataset.timerId);
        } else if (action === 'stop-timer') {
          const timer = getTimers().find((item) => item.id === actionButton.dataset.timerId);
          if (!timer) return;
          const rawSeconds = Math.round(getTimerTotalSeconds(timer));
          const billedHours = calcBilledHours(rawSeconds, getSettings().increment);
          openConfirmModal({
            title: 'Stop and log this timer?',
            message: `Raw time ${formatRawDuration(rawSeconds)} will bill as ${formatHours(billedHours)}.`,
            confirmLabel: 'Stop and Log',
            confirmClass: 'btn-gold',
            onConfirm: () => {
              closeModal();
              stopTimer(actionButton.dataset.timerId);
            },
          });
        } else if (action === 'discard-timer') {
          openConfirmModal({
            title: 'Discard this timer?',
            message: 'This removes the timer without creating a billing entry.',
            confirmLabel: 'Discard Timer',
            confirmClass: 'btn-danger',
            onConfirm: () => {
              closeModal();
              discardTimer(actionButton.dataset.timerId);
            },
          });
        } else if (action === 'toggle-timer-billable') {
          toggleTimerBillable(actionButton.dataset.timerId, actionButton.checked);
        } else if (action === 'prefill-email-tier') {
          const select = document.getElementById('email-type');
          if (select) select.value = actionButton.dataset.tier;
          showToast('Email tier selected.', 'success');
        } else if (action === 'analyze-email') {
          runEmailAnalysis();
        } else if (action === 'apply-analysis') {
          applyAnalysisToForm();
        } else if (action === 'analysis-to-review') {
          sendAnalysisToReview();
        } else if (action === 'sync-gmail') {
          syncGmailViaBackend();
        } else if (action === 'sync-calendar') {
          syncCalendarViaBackend();
        } else if (action === 'sync-outlook') {
          syncOutlookViaBackend();
        } else if (action === 'save-draft') {
          const form = actionButton.closest('form.draft-card');
          if (form) {
            updateDraft(actionButton.dataset.draftId, readDraftForm(form));
            renderAll();
            showToast('Draft updated.', 'success');
          }
        } else if (action === 'mark-matter-billed') {
          const matterId = actionButton.dataset.matterId;
          const display = getDisplayMatter(matterId);
          openConfirmModal({
            title: 'Mark this matter billed?',
            message: `Clears all unbilled entries for ${display.clientName} - ${display.matterName} from WIP. They stay in your Log; this just marks them as sent to billing.`,
            confirmLabel: 'Mark Billed',
            confirmClass: 'btn-gold',
            onConfirm: () => {
              closeModal();
              const stamp = { method: 'manual', at: todayKey() };
              setEntries(getEntries().map((entry) => (entry.matterId === matterId && entry.billable && !entry.syncedTo ? { ...entry, syncedTo: stamp } : entry)));
              renderAll();
              showToast('Matter marked billed and cleared from WIP.', 'success');
            },
          });
        } else if (action === 'bump-email-hours') {
          const input = document.getElementById('email-hours');
          if (input) input.value = actionButton.dataset.hours;
          updateEmailBillNudge();
          showToast('Time bumped to the tier default.', 'success');
        } else if (action === 'sync-notion') {
          syncNotionTasks({ sample: false });
        } else if (action === 'sync-notion-sample') {
          syncNotionTasks({ sample: true });
        } else if (action === 'open-writing-guide') {
          openWritingGuide();
        } else if (action === 'use-template') {
          const template = actionButton.dataset.template || '';
          closeModal();
          if (state.currentView !== 'view-review') showView('view-review');
          const field = document.getElementById('draft-description');
          if (field) {
            field.value = template;
            field.focus();
            field.setSelectionRange(template.length, template.length);
          }
          showToast('Template added — fill the brackets, then Add to Review.', 'success');
        } else if (action === 'lint-draft') {
          runDraftLint(actionButton.dataset.draftId);
        } else if (action === 'apply-lint') {
          applyDraftLint(actionButton.dataset.draftId);
        } else if (action === 'test-backend') {
          testBackendConnection();
        } else if (action === 'sign-out') {
          signOut();
        } else if (action === 'sign-in') {
          showSignIn();
        } else if (action === 'edit-draft') {
          const card = actionButton.closest('form.draft-card');
          if (card) card.classList.add('editing');
        } else if (action === 'edit-draft-done') {
          const card = actionButton.closest('form.draft-card');
          if (card) card.classList.remove('editing');
        } else if (action === 'show-evidence') {
          openEvidenceDrawer(actionButton.dataset.draftId);
        } else if (action === 'close-evidence') {
          closeEvidenceDrawer();
        } else if (action === 'approve-from-evidence') {
          closeEvidenceDrawer();
          const card = document.querySelector(`form.draft-card[data-draft-id="${actionButton.dataset.draftId}"]`);
          if (card) {
            approveDraftWithAnimation(card);
          } else {
            approveDraft(actionButton.dataset.draftId);
            renderAll();
            showToast('Approved & billed to Clio.', 'success');
          }
        } else if (action === 'discard-draft') {
          const draftId = actionButton.dataset.draftId;
          const discarded = getDrafts().find((d) => d.id === draftId);
          if (!discarded) return;
          pushDraftDecision(discarded, 'discarded');
          discardDraft(draftId);
          delete state.draftLint[draftId];
          renderAll();
          showToast('Draft skipped.', '', {
            actionLabel: 'Undo',
            onAction: () => {
              setDrafts([discarded, ...getDrafts()]);
              renderAll();
              showToast('Draft restored.', 'success');
            },
          });
        } else if (action === 'approve-all-drafts') {
          const pending = getPendingDrafts();
          if (!pending.length) return;
          openConfirmModal({
            title: `Approve all ${pending.length} drafts?`,
            message: 'Each draft is sent to your billing log using its current values. You can still edit entries afterward in the Log.',
            confirmLabel: 'Approve All',
            confirmClass: 'btn-gold',
            onConfirm: () => {
              closeModal();
              getPendingDrafts().forEach((draft) => approveDraft(draft.id));
              renderAll();
              showToast('All drafts approved to the log.', 'success');
            },
          });
        } else if (action === 'edit-entry') {
          openEditEntryModal(actionButton.dataset.entryId);
        } else if (action === 'delete-client') {
          const client = getClientById(actionButton.dataset.clientId);
          openConfirmModal({
            title: 'Delete this client?',
            message: `Delete ${client ? client.name : 'this client'} and all of its matters. Existing entries will be preserved and shown as Unknown Matter.`,
            confirmLabel: 'Delete Client',
            confirmClass: 'btn-danger',
            onConfirm: () => {
              closeModal();
              deleteClient(actionButton.dataset.clientId);
            },
          });
        } else if (action === 'delete-matter') {
          const matter = getMatterById(actionButton.dataset.matterId);
          openConfirmModal({
            title: 'Delete this matter?',
            message: `Delete ${matter ? matter.name : 'this matter'}. Existing entries will be preserved and shown as Unknown Matter.`,
            confirmLabel: 'Delete Matter',
            confirmClass: 'btn-danger',
            onConfirm: () => {
              closeModal();
              deleteMatter(actionButton.dataset.matterId);
            },
          });
        }
      }

      function handleGlobalSubmit(event) {
        if (event.target.id === 'new-timer-form') {
          event.preventDefault();
          createTimer({
            matterId: event.target.matterId.value,
            description: event.target.description.value,
            billable: event.target.billable.checked,
          });
          event.target.reset();
          event.target.billable.checked = true;
        } else if (event.target.id === 'manual-email-form') {
          event.preventDefault();
          addManualEmailEntry({
            date: event.target.date.value,
            matterId: event.target.matterId.value,
            emailType: event.target.emailType.value,
            customHours: event.target.customHours.value,
            description: event.target.description.value,
            billable: event.target.billable.checked,
          });
          renderAll();
        } else if (event.target.id === 'log-filter-form') {
          event.preventDefault();
          state.logFilters = {
            startDate: event.target.startDate.value,
            endDate: event.target.endDate.value,
            matterId: event.target.matterId.value,
            billable: event.target.billable.value,
          };
          renderLogView();
          showToast('Filters applied.', 'success');
        } else if (event.target.id === 'settings-form') {
          event.preventDefault();
          saveSettingsFromForm(event.target);
        } else if (event.target.id === 'add-client-form') {
          event.preventDefault();
          addClient(event.target.clientName.value);
          event.target.reset();
        } else if (event.target.classList.contains('add-matter-form')) {
          event.preventDefault();
          addMatter(event.target.clientId.value, event.target.matterName.value, event.target.rateOverride.value);
          event.target.reset();
        } else if (event.target.id === 'edit-entry-form') {
          event.preventDefault();
          saveEntryEdits(event.target.dataset.entryId, {
            date: event.target.date.value,
            matterId: event.target.matterId.value,
            description: event.target.description.value,
            billable: event.target.billable.checked,
          });
        } else if (event.target.id === 'quick-capture-form') {
          event.preventDefault();
          const raw = event.target.text.value.trim();
          if (!raw) {
            showToast('Type what you worked on first.', 'error');
            return;
          }
          const parsed = parseQuickCapture(raw);
          const hours = parsed.hours == null ? 0.2 : parsed.hours;
          const evidenceBits = [];
          evidenceBits.push(parsed.matchedTime ? `Parsed ${formatHours(hours)}` : `No time found — defaulted to ${formatHours(hours)}`);
          evidenceBits.push(parsed.matchedMatter ? 'matched matter from text' : 'matter not detected — set to default');
          addDraft({
            source: 'manual',
            description: parsed.description,
            matterId: parsed.matterId,
            date: todayKey(),
            estimatedSeconds: Math.round(hours * 3600),
            billable: true,
            evidence: `Quick capture: "${raw}". ${evidenceBits.join('; ')}.`,
          });
          event.target.reset();
          renderAll();
          showView('view-review');
          showToast(`Captured ${formatHours(hours)} — review and approve it.`, 'success');
        } else if (event.target.id === 'reconcile-form') {
          event.preventDefault();
          const form = event.target;
          const description = form.description.value.trim();
          if (!description) {
            showToast('Describe the unaccounted time first.', 'error');
            return;
          }
          const hours = Number(form.hours.value) || 0;
          if (hours <= 0) {
            showToast('Enter how many hours to capture.', 'error');
            return;
          }
          addDraft({
            source: 'manual',
            description,
            matterId: form.matterId.value,
            date: form.date.value,
            estimatedSeconds: Math.round(hours * 3600),
            billable: true,
            evidence: `Time check: ${formatHours(hours)} captured against an unaccounted gap on ${formatDateLabel(form.date.value)}.`,
          });
          renderAll();
          showView('view-review');
          showToast('Missing time sent to Review.', 'success');
        } else if (event.target.id === 'add-draft-form') {
          event.preventDefault();
          const fields = readDraftForm(event.target);
          if (!fields.description.trim()) {
            showToast('Add a description for the draft.', 'error');
            return;
          }
          addDraft({ source: 'manual', ...fields });
          renderAll();
          showToast('Draft added to review.', 'success');
        } else if (event.target.matches('form.draft-card')) {
          event.preventDefault();
          approveDraftWithAnimation(event.target);
        }
      }

      function handleGlobalInput(event) {
        const target = event.target;
        if (target.id === 'email-hours' || target.id === 'email-type' || target.id === 'email-matter') {
          updateEmailBillNudge();
          return;
        }
        const card = target.closest ? target.closest('form.draft-card') : null;
        if (card && (target.name === 'hours' || target.name === 'matterId')) {
          const slot = card.querySelector('.bill-nudge-slot');
          if (slot) slot.innerHTML = draftBillNudgeHtml(card.hours.value, card.matterId.value);
        }
      }

      function readDraftForm(form) {
        return {
          description: form.description.value,
          matterId: form.matterId.value,
          date: form.date.value,
          estimatedSeconds: Math.round((Number(form.hours.value) || 0) * 3600),
          billable: form.billable.checked,
        };
      }

      function persistRunningTimerHeartbeat() {
        const timers = getTimers();
        if (timers.some((timer) => timer.running)) {
          setTimers(timers);
        }
      }

      function hasRunningTimers() {
        return getTimers().some((timer) => timer.running);
      }

      function startTicker() {
        if (state.tickHandle) {
          window.clearInterval(state.tickHandle);
        }
        state.tickHandle = window.setInterval(() => {
          if (!hasRunningTimers()) {
            return;
          }
          persistRunningTimerHeartbeat();
          renderShell();
          if (state.currentView === 'view-timers') {
            renderTimersView();
          } else if (state.currentView === 'view-dashboard') {
            renderDashboardView();
          }
        }, 1000);
      }

      // ---- Auth module (Supabase). Dormant unless AUTH_ENABLED. ----
      let supabaseClient = null;
      let authSession = null;
      let authMode = 'signin';

      async function getSupabaseClient() {
        if (supabaseClient) return supabaseClient;
        const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
        supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        return supabaseClient;
      }

      function authToken() {
        return (authSession && authSession.access_token) || '';
      }

      async function initAuth() {
        if (!AUTH_ENABLED) return true; // login off -> app runs as today
        const client = await getSupabaseClient();
        const { data } = await client.auth.getSession();
        authSession = data.session || null;
        client.auth.onAuthStateChange((_event, session) => {
          authSession = session || null;
          applyAuthGate();
          if (authSession) { renderAll(); syncGmailConnection(); }
        });
        // When the user returns to a backgrounded tab, Supabase may have paused
        // its token-refresh timer. Re-sync the session on focus so an expired
        // token renews (or the sign-in screen appears) without a manual reload.
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') revalidateSession();
        });
        window.addEventListener('focus', () => { revalidateSession(); });
        applyAuthGate();
        if (authSession) syncGmailConnection();
        return Boolean(authSession);
      }

      function applyAuthGate() {
        const gate = document.getElementById('auth-gate');
        const shell = document.querySelector('.app-shell');
        if (!AUTH_ENABLED || authSession) {
          gate.hidden = true;
          shell.style.display = '';
          return;
        }
        gate.hidden = false;
        shell.style.display = 'none';
        renderAuthGate();
      }

      function renderAuthGate() {
        const isSignup = authMode === 'signup';
        document.getElementById('auth-title').textContent = isSignup ? 'Create your account' : 'Sign in';
        document.getElementById('auth-sub').textContent = isSignup
          ? 'Start capturing billable time automatically.'
          : 'Welcome back. Sign in to your LexClock account.';
        document.getElementById('auth-submit').textContent = isSignup ? 'Create account' : 'Sign in';
        document.getElementById('auth-switch-text').textContent = isSignup ? 'Already have an account?' : 'New to LexClock?';
        document.getElementById('auth-switch-btn').textContent = isSignup ? 'Sign in' : 'Create an account';
        document.getElementById('auth-password').setAttribute('autocomplete', isSignup ? 'new-password' : 'current-password');
      }

      function setAuthMessage(text, kind) {
        const el = document.getElementById('auth-message');
        if (!text) { el.hidden = true; el.textContent = ''; return; }
        el.hidden = false;
        el.textContent = text;
        el.className = 'auth-message' + (kind ? ' auth-message-' + kind : '');
      }

      async function handleAuthSubmit(event) {
        event.preventDefault();
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value;
        if (!email) { setAuthMessage('Enter your email.', 'error'); return; }
        setAuthMessage('Working…', '');
        try {
          const client = await getSupabaseClient();
          if (authMode === 'signup') {
            const { error } = await client.auth.signUp({ email, password });
            if (error) throw error;
            setAuthMessage('Check your email to confirm your account, then sign in.', 'ok');
            authMode = 'signin';
            renderAuthGate();
          } else {
            const { error } = await client.auth.signInWithPassword({ email, password });
            if (error) throw error;
            // onAuthStateChange gates us in.
          }
        } catch (err) {
          setAuthMessage((err && err.message) || 'Sign-in failed.', 'error');
        }
      }

      async function handleAuthAction(action) {
        if (action === 'toggle-mode') {
          authMode = authMode === 'signup' ? 'signin' : 'signup';
          setAuthMessage('', '');
          renderAuthGate();
          return;
        }
        const redirectTo = window.location.origin + window.location.pathname;
        const email = document.getElementById('auth-email').value.trim();
        try {
          const client = await getSupabaseClient();
          if (action === 'google') {
            setAuthMessage('Redirecting to Google…', '');
            const { error } = await client.auth.signInWithOAuth({ provider: 'google', options: { redirectTo } });
            if (error) setAuthMessage(error.message, 'error');
          } else if (action === 'magic') {
            if (!email) { setAuthMessage('Enter your email first.', 'error'); return; }
            setAuthMessage('Sending…', '');
            const { error } = await client.auth.signInWithOtp({ email, options: { emailRedirectTo: redirectTo } });
            setAuthMessage(error ? error.message : 'Magic link sent — check your email.', error ? 'error' : 'ok');
          } else if (action === 'forgot') {
            if (!email) { setAuthMessage('Enter your email first.', 'error'); return; }
            setAuthMessage('Sending…', '');
            const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo });
            setAuthMessage(error ? error.message : 'Password reset email sent.', error ? 'error' : 'ok');
          }
        } catch (err) {
          setAuthMessage((err && err.message) || 'Something went wrong.', 'error');
        }
      }

      async function signOut() {
        if (!AUTH_ENABLED) return;
        const client = await getSupabaseClient();
        await client.auth.signOut();
        authSession = null;
        applyAuthGate();
      }

      // Bring up the sign-in screen on demand (the Settings "Sign in" button).
      function showSignIn() {
        if (!AUTH_ENABLED) { showToast('Sign-in is not configured.', 'error'); return; }
        authSession = null;
        applyAuthGate();
      }

      // Re-sync our in-memory session with Supabase's stored one. getSession()
      // transparently refreshes an expired access token when a valid refresh
      // token exists, so this both renews live sessions and detects dead ones.
      // Returns true if we end up signed in. Used on tab focus and after a 401
      // so an expired session recovers (or surfaces the sign-in screen) without
      // the user having to reload the page.
      async function revalidateSession() {
        if (!AUTH_ENABLED) return false;
        try {
          const client = await getSupabaseClient();
          const { data } = await client.auth.getSession();
          authSession = data.session || null;
        } catch (_) {
          authSession = null;
        }
        applyAuthGate();
        return Boolean(authSession);
      }

      function initializeApp() {
        seedDataIfNeeded();
        renderAll();
        showView(state.currentView);
        startTicker();
        document.getElementById('help-modal-overlay').addEventListener('click', function (event) {
          if (event.target === this) closeHelpModal();
        });
        document.getElementById('help-modal-close').addEventListener('click', closeHelpModal);
        document.addEventListener('keydown', function (event) {
          if (event.key === 'Escape') {
            closeHelpModal();
            closeEvidenceDrawer();
          }
        });
        document.addEventListener('click', handleGlobalClick);
        document.addEventListener('submit', handleGlobalSubmit);
        document.addEventListener('input', handleGlobalInput);
        document.addEventListener('change', handleGlobalInput);
        document.querySelector('.sidebar-nav').addEventListener('click', handleNav);
        document.querySelector('.mobile-nav').addEventListener('click', handleNav);

        document.getElementById('auth-form').addEventListener('submit', handleAuthSubmit);
        document.getElementById('auth-gate').addEventListener('click', function (event) {
          const btn = event.target.closest('[data-auth-action]');
          if (btn) handleAuthAction(btn.dataset.authAction);
        });
        initAuth().catch((err) => console.error('[auth] init failed', err));
      }

      document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
  </body>
</html>
